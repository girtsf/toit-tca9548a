name: Publish package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  create-release:
    name: Create new release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: toitlang/action-publish@v1.5.0
