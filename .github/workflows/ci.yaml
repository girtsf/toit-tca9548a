name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by publish.yaml to gate releases on the tests.
  workflow_call:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toit-version: [oldest, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # "oldest" is the minimum SDK from package.yaml.
      - name: Resolve Toit version
        id: toit-version
        shell: bash
        run: |
          if [[ "${{ matrix.toit-version }}" == "oldest" ]]; then
            sdk=$(grep -E '^[[:space:]]+sdk:' package.yaml | head -1 \
              | sed -E 's/^[[:space:]]+sdk:[[:space:]]*//; s/^\^//' \
              | tr -d "\"' ")
            echo "version=v$sdk" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: toitlang/action-setup@v1
        with:
          toit-version: ${{ steps.toit-version.outputs.version }}

      - name: Test
        run: make test

      - name: Analyze
        run: make analyze
